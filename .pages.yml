media: media

content:
  - name: news
    label: Новости и статьи
    type: collection
    path: content/news
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: date
        label: Дата публикации
        type: date
      - name: category
        label: Рубрика
        type: select
        options:
          values:
            - Новости
            - Аналитика
            - Общество
            - Культура
            - Мир
            - Видео
      - name: cover
        label: Обложка
        type: image
      - name: video
        label: Посилання на відео
        type: string
      - name: description
        label: Краткое описание
        type: text
      - name: body
        label: Текст статьи
        type: rich-text
        name: title_en
        label: Заголовок (English)
        type: string
      - name: description_en
        label: Краткое описание (English)
        type: text
      - name: body_en
        label: Текст статьи (English)
        type: rich-text